<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гра «Міф чи правда»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: editorial game card on milk paper; condensed caps + italic script in chocolate and latte; answer chips as progress */
:root{
  color-scheme:light;
  --candle:#F2ECE2; --paper:#FCFAF6; --leaf:#A3805F; --leaf-soft:#EADFD0; --juniper:#3B271C; --black:#22160F; --white:#ffffff;
  --muted:#7C6757; --line:#E3D7C7;
  --cond:"Oswald","Arial Narrow",Impact,sans-serif;
  --script:"Cormorant Garamond",Georgia,serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(90% 60% at 100% 0%,#E9DCCB 0%,transparent 70%),radial-gradient(80% 50% at 0% 100%,#EFE4D5 0%,transparent 70%),var(--candle);color:var(--black);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--juniper)}
.brand b{font-family:var(--cond);font-size:16px;letter-spacing:.06em;font-weight:600}
.card{background:var(--paper);border-radius:26px;padding:26px 22px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
/* intro title */
.title{position:relative;display:flex;flex-direction:column;align-items:flex-start;padding-top:6px}
.title .big{font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:clamp(76px,24vw,120px);line-height:.86;letter-spacing:-.01em;color:var(--juniper)}
.title .big.alt{color:var(--black)}
.title .small{font-family:var(--cond);font-weight:500;text-transform:uppercase;font-size:clamp(22px,6vw,30px);letter-spacing:.08em;color:var(--leaf);margin:4px 0}
.script{font-family:var(--script);font-style:italic;font-weight:500;color:var(--leaf);font-size:clamp(28px,8vw,38px);line-height:1}
.title .script{align-self:flex-end;margin-top:6px;transform:rotate(-5deg)}
.lead{color:var(--muted)}
.rules{display:flex;gap:8px;flex-wrap:wrap}
.rules span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--juniper)}
.btn{appearance:none;border:0;border-radius:999px;background:var(--juniper);color:var(--candle);font:700 16px/1 var(--sans);padding:18px 24px;cursor:pointer;text-align:center;text-decoration:none;display:block;letter-spacing:.02em}
.btn:hover{background:var(--black)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--juniper);border:1px solid var(--line)}
.expert{font-size:13px;color:var(--muted)}
/* chips progress */
.chips{display:flex;gap:6px}
.chip{flex:1;height:8px;border-radius:999px;background:transparent;border:1.5px solid var(--line)}
.chip.done{background:var(--juniper);border-color:var(--juniper)}
.chip.now{border-color:var(--juniper)}
.meta{display:flex;justify-content:space-between;align-items:baseline}
.num{font-family:var(--cond);font-weight:700;font-size:44px;line-height:1;color:var(--juniper)}
.num small{font-size:20px;color:var(--leaf);font-weight:500}
.meta .script{font-size:24px}
.statement{font-family:var(--script);font-weight:600;font-size:clamp(28px,7.6vw,38px);line-height:1.1;color:var(--black)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{appearance:none;cursor:pointer;border-radius:20px;padding:22px 10px;font-family:var(--cond);font-weight:600;font-size:26px;letter-spacing:.06em;text-transform:uppercase;transition:transform .12s}
.choice:active{transform:scale(.98)}
.choice{background:var(--white);color:var(--juniper);border:2px solid var(--line)}
.choice:hover{border-color:var(--leaf)}
.choice[aria-pressed="true"]{background:var(--juniper);color:var(--candle);border-color:var(--juniper)}
.verdict{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px}
.verdict.ok{background:var(--leaf-soft)}
.verdict.bad{background:var(--black);color:var(--white)}
.verdict .v-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.verdict .word{font-family:var(--cond);font-weight:700;font-size:40px;line-height:1;text-transform:uppercase}
.verdict.ok .word{color:var(--juniper)}
.verdict .you{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.verdict p{font-size:15px}
.verdict.bad p{color:rgba(255,255,255,.85)}
/* result */
.score{display:flex;align-items:flex-end;gap:12px}
.score b{font-family:var(--cond);font-weight:700;font-size:clamp(96px,28vw,140px);line-height:.8;color:var(--juniper)}
.score span{font-family:var(--cond);font-size:36px;color:var(--leaf);padding-bottom:6px}
.res-title{font-family:var(--cond);font-weight:600;text-transform:uppercase;font-size:clamp(26px,7vw,34px);line-height:1.05;letter-spacing:.01em;color:var(--black)}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.review-old li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.review li:first-child{border-top:0}
.review .ic{font-weight:800}
.review .ok .ic{color:var(--leaf)}
.review .bad .ic{color:var(--black)}
.review .ans{font-family:var(--cond);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.rv-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rv-head h3{font-family:var(--cond);font-weight:600;text-transform:uppercase;font-size:20px;letter-spacing:.04em;color:var(--juniper)}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--leaf);font:700 14px var(--sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.rvs{display:flex;flex-direction:column;gap:8px}
details.rv{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden}
details.rv summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:14px 14px;font-size:14.5px}
details.rv summary::-webkit-details-marker{display:none}
details.rv .ic{font-weight:800}
details.rv.ok .ic{color:var(--leaf)}
details.rv.bad .ic{color:#B0503A}
details.rv .more{font-size:12px;font-weight:700;color:var(--leaf);white-space:nowrap}
details.rv[open] .more{color:var(--muted)}
details.rv .rv-body{padding:0 14px 14px 48px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--black)}
.rv-verdict{font-family:var(--cond);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rv-verdict b{color:var(--juniper)}
/* offer */
.offer{background:var(--juniper);color:var(--candle);border-radius:24px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.offer-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.ny{background:var(--candle);color:var(--juniper);font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:5px 11px}
.cd{color:rgba(239,233,215,.75)}
.offer h3{font-family:var(--cond);font-weight:600;text-transform:uppercase;font-size:28px;letter-spacing:.02em;color:var(--candle)}
.offer-line{color:rgba(239,233,215,.85)}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price strong{font-family:var(--cond);font-weight:700;font-size:72px;line-height:.85}
.price s{opacity:.55;font-size:20px}
.save{background:var(--leaf);color:var(--white);border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px}
.incl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:14.5px}
.incl li{display:flex;gap:10px}.incl li::before{content:"—";color:var(--leaf);font-weight:800}
.offer .btn{background:var(--candle);color:var(--juniper)}
.offer .btn:hover{background:var(--white)}
.fine{font-size:12px;color:rgba(239,233,215,.65);text-align:center}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

h1[tabindex]:focus,h2[tabindex]:focus{outline:none}</style>
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>

<body>
<div class="wrap">
  <div class="brand"><b>Оля Євміна</b><span>дієтолог-трихолог</span></div>
  <main class="card" id="app" aria-live="polite"></main>
  <p class="foot">Інформація має освітній характер і не замінює консультацію лікаря.</p>
</div>
<script>

/* === Налаштування (міняти тут) === */
const CHECKOUT_URL = "https://buy.stripe.com/7sYcN6cWAgO6fIvdY58EM0t"; // ⚠️ замінити на посилання Stripe на $5
const PRICE = 5, OLD_PRICE = 60, CURRENCY = "USD";
const DEADLINE = "2026-12-31T23:59:59";  // кінець новорічної знижки
/* ================================= */

const app=document.getElementById("app");
const fired=new Set();
function px(type,name,params){ if(fired.has(name)) return; fired.add(name); try{ if(window.fbq) fbq(type,name,params||{}); }catch(e){} }
function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; }
function focusTitle(){ const h=app.querySelector("h1,h2"); if(h){ h.setAttribute("tabindex","-1"); try{h.focus({preventScroll:true});}catch(e){} } window.scrollTo(0,0); }
function offerHTML(line){
  return `<section class="offer">
    <div class="offer-top"><span class="ny">❄ Знижка до Нового року</span><span class="cd" id="cd"></span></div>
    <h3>Інтенсив «Розкішне волосся»</h3>
    <p class="offer-line">${line}</p>
    <div class="price"><strong>$${PRICE}</strong><s>$${OLD_PRICE}</s><span class="save">−${Math.round((1-PRICE/OLD_PRICE)*100)}%</span></div>
    <ul class="incl">
      <li>7 відеоуроків у Telegram-боті</li>
      <li>Які аналізи здати і як їх читати</li>
      <li>План харчування, рецепти, смузі, суперфуди</li>
      <li>Як обирати добавки та догляд</li>
      <li>Безкоштовний додаток: завантажте аналізи за кілька хвилин</li>
      <li>Доступ до матеріалів 60 днів</li>
    </ul>
    <a class="btn buy" id="buy" href="${CHECKOUT_URL}">Забрати за $${PRICE}</a>
    <p class="fine">Після оплати уроки приходять у Telegram-бот · 14 днів на повернення коштів</p>
  </section>`;
}
function startCountdown(){
  const el=document.getElementById("cd"); if(!el) return; const end=new Date(DEADLINE).getTime();
  function tick(){ let s=Math.max(0,Math.floor((end-Date.now())/1000)); const d=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); const m=Math.floor(s%3600/60);
    el.textContent= end<=Date.now() ? "Знижка завершилась" : `ще ${d} ${plural(d,"день","дні","днів")} ${h} год ${m} хв`; }
  tick(); setInterval(tick,30000);
}
function bindBuy(category,profile){
  const a=document.getElementById("buy"); if(!a) return;
  const url=CHECKOUT_URL+(CHECKOUT_URL.indexOf("?")<0?"?":"&")+"utm_source="+category+"&utm_content="+encodeURIComponent(profile)+"&client_reference_id="+category+"_"+encodeURIComponent(profile);
  a.href=url;
  a.addEventListener("click",function(e){ e.preventDefault();
    try{ if(window.fbq) fbq("track","InitiateCheckout",{value:PRICE,currency:CURRENCY,content_name:"Інтенсив «Розкішне волосся»",content_category:category,num_items:1,profile:profile}); }catch(err){}
    setTimeout(function(){ window.location.href=url; },350); });
  startCountdown();
}

const P="QM", CATEGORY="quiz_myths";
const S=[
 {t:"Правильний шампунь може зупинити випадіння",a:false,e:"Шампунь очищає шкіру голови, але фолікул живиться зсередини: залізом, білком, вітамінами. Якщо причина в дефіциті чи гормонах, баночка її не прибере."},
 {t:"Випадіння може початися через 2–3 місяці після стресу чи хвороби",a:true,e:"Сильний стрес «вимикає» частину фолікулів, і волосся випадає із запізненням. Тому зв'язок із причиною рідко помічають."},
 {t:"Біотин допомагає всім, у кого випадає волосся",a:false,e:"Біотин допомагає лише при його дефіциті, а це рідкість. До того ж великі дози спотворюють результати деяких аналізів, зокрема на щитовидку."},
 {t:"Часте миття голови посилює випадіння",a:false,e:"Під час миття випадає волосся, яке й так уже готувалося випасти. Якщо мити рідше, воно просто накопичується до наступного разу."},
 {t:"Дефіцит заліза може бути навіть при нормальному гемоглобіні",a:true,e:"Спершу виснажуються запаси заліза (феритин), і тільки потім падає гемоглобін. Волосся реагує вже на перший етап."},
 {t:"Якщо регулярно підстригати кінчики, волосся росте швидше",a:false,e:"Ріст іде від фолікула, а не від кінчиків. Стрижка прибирає посічені кінці, тож довжина просто не ламається."},
 {t:"Сувора дієта може відбитися на волоссі",a:true,e:"Коли бракує білка й енергії, тіло економить на волоссі першим: воно не життєво необхідне. Наслідки часто видно через кілька місяців."},
 {t:"Випадати 50–100 волосин на день — це норма",a:true,e:"Волосся постійно оновлюється, тож така кількість — природний цикл. Тривожно, коли випадає помітно більше або волосся рідшає."}
];
let step=-1; const picks=S.map(()=>null);
function chipsHTML(cur){ return `<div class="chips" aria-hidden="true">${S.map((s,i)=>`<span class="chip ${picks[i]!==null?"done":(i===cur?"now":"")}"></span>`).join("")}</div>`; }
function render(){ if(step<0) intro(); else if(step>=S.length) showResult(); else statement(); focusTitle(); }
function intro(){
  app.innerHTML=`<div class="title"><span class="big">Міф</span><span class="small">чи</span><span class="big alt">правда</span><span class="script">гра про волосся</span></div>
  <p class="lead">8 тверджень, які чула кожна, хто боролася з випадінням. Обери для кожного «правда» чи «міф», а в кінці дізнаєшся свій результат і розбір кожної відповіді.</p>
  <div class="rules"><span>8 тверджень</span><span>1 хвилина</span><span>розбір у кінці</span></div>
  <button class="btn" id="go" type="button">Почати гру</button>
  <p class="expert">Пояснення від Олі Євміної, дієтолога-трихолога з вищою європейською медичною освітою.</p>`;
  document.getElementById("go").onclick=()=>{ px("trackCustom",P+"_Start"); step=0; render(); };
}
function statement(){
  const s=S[step], picked=picks[step];
  px("trackCustom",P+"_Q"+(step+1),{question:step+1});
  const n=String(step+1).padStart(2,"0");
  const body=`<div class="choices"><button type="button" class="choice" id="pt" aria-pressed="${picked===true}">Правда</button><button type="button" class="choice" id="pm" aria-pressed="${picked===false}">Міф</button></div>
    <div style="display:flex;gap:10px"><button type="button" class="btn ghost" id="back">Назад</button><button type="button" class="btn" id="next" style="flex:1" ${picked===null?"disabled":""}>${step===S.length-1?"Мій результат":"Далі"}</button></div>`;
  app.innerHTML=`${chipsHTML(step)}
  <div class="meta"><span class="num">${n}<small> / 08</small></span><span class="script">як думаєш?</span></div>
  <h2 class="statement">«${s.t}»</h2>${body}`;
  const choose=v=>{ picks[step]=v; document.getElementById("pt").setAttribute("aria-pressed",v===true); document.getElementById("pm").setAttribute("aria-pressed",v===false); document.getElementById("next").disabled=false; };
  document.getElementById("pt").onclick=()=>choose(true);
  document.getElementById("pm").onclick=()=>choose(false);
  document.getElementById("back").onclick=()=>{ step=Math.max(-1,step-1); render(); };
  document.getElementById("next").onclick=()=>{ if(picks[step]!==null){ step++; render(); } };
}
function showResult(){
  const score=S.reduce((a,s,i)=>a+(picks[i]===s.a?1:0),0);
  px("trackCustom",P+"_Result",{score:score});
  let title,text;
  if(score<=3){ title="Міфи поки керують твоїм доглядом"; text="Саме через такі міфи гроші йдуть на шампуні й вітаміни, які не можуть допомогти. Добра новина: розібратися реально, і це займає 7 уроків."; }
  else if(score<=6){ title="Ти знаєш багато, але кілька міфів ще коштують тобі грошей"; text="Найдорожчі міфи — ті, через які купуєш засоби навмання. Наступний крок — зрозуміти, що працює саме для твого волосся."; }
  else { title="Ти знаєш про волосся більше, ніж більшість"; text="Тепер найцікавіше: застосувати це до себе. Знайти саме свою причину випадіння і скласти план, а не просто знати теорію."; }
  app.innerHTML=`${chipsHTML(-1)}
  <span class="script">твій результат</span>
  <div class="score"><b>${score}</b><span>/ 8</span></div>
  <h2 class="res-title">${title}</h2>
  <p class="lead">${text}</p>
  <div class="rv-head"><h3>Розбір кожної відповіді</h3><button type="button" class="linkbtn" id="openAll">Розгорнути все</button></div>
  <div class="rvs">${S.map((s,i)=>{const ok=picks[i]===s.a;return `<details class="rv ${ok?"ok":"bad"}"><summary><span class="ic">${ok?"✓":"✕"}</span><span>${s.t}</span><span class="more">Детальніше</span></summary><div class="rv-body"><p class="rv-verdict">Твоя відповідь: ${picks[i]?"правда":"міф"} · Насправді: <b>${s.a?"правда":"міф"}</b></p><p>${s.e}</p></div></details>`;}).join("")}</div>
  ${offerHTML("Досить міфів. На інтенсиві Оля покаже, як знайти саме твою причину випадіння і що з нею робити.")}
  <button class="btn ghost" id="again" type="button">Зіграти ще раз</button>`;
  bindBuy(CATEGORY,"score"+score);
  document.getElementById("again").onclick=()=>{ picks.fill(null); step=-1; render(); };
  document.getElementById("openAll").onclick=function(){ const all=[...app.querySelectorAll("details.rv")]; const open=!all.every(d=>d.open); all.forEach(d=>d.open=open); this.textContent=open?"Згорнути все":"Розгорнути все"; };
}
render();

</script>
</body>
</html>
